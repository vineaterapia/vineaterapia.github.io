<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>vineaterapia.com — Biblioteca Psicológica</title>
<style>
  :root{
    --lilac:#6D4CBB;
    --lilac-dark:#56389E;
    --lilac-soft:#EDE6FA;
    --lilac-mid:#DFD3F8;
    --paper:#F7F4FC;
    --white:#FFFFFF;
    --ink:#2A2142;
    --muted:#6D6187;
    --subtle:#9589AF;
    --line:#E6DDF5;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
    --shadow:0 4px 18px rgba(72,48,125,.06);
    --shadow-lg:0 18px 44px rgba(72,48,125,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  a{text-decoration:none;color:inherit}

  /* Sidebar */
  .sidebar{width:262px;flex:0 0 262px;background:var(--white);color:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:2px 8px 22px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .brand .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#7C5AC8,#5D3EA8);display:grid;place-items:center;flex:0 0 42px;box-shadow:0 6px 14px rgba(109,76,187,.28)}
  .brand .logo svg{width:22px;height:22px}
  .brand h1{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.1;color:var(--ink);letter-spacing:-.2px}
  .brand span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
  .nav-lbl{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--subtle);padding:12px 12px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;color:#54496E;font-size:14px;font-weight:500;transition:.15s;margin-bottom:3px}
  .nav-item:hover{background:var(--lilac-soft);color:var(--ink)}
  .nav-item.active{background:var(--lilac);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(109,76,187,.24)}
  .nav-item.premium{background:linear-gradient(135deg,#EAE0FA,#DECFF7);border:1px solid #CBB6EE;color:#3E2773;font-weight:600;margin-top:8px}
  .nav-item.premium:hover{background:linear-gradient(135deg,#E1D3F8,#D3BFF5);color:#2A2142}
  .nav-item.premium.active{background:var(--lilac);color:#fff;border-color:var(--lilac)}
  .notice-banner{display:flex;align-items:flex-start;gap:14px;background:linear-gradient(135deg,#F3ECFC,#EAE0FA);border:1px solid #CBB6EE;border-left:4px solid var(--lilac);border-radius:14px;padding:16px 18px;margin-bottom:22px;color:var(--ink);font-size:13.8px;line-height:1.55;box-shadow:var(--shadow)}
  .notice-banner svg{width:20px;height:20px;color:var(--lilac);flex:0 0 20px;margin-top:2px}
  .nav-item .ic{width:20px;height:20px;flex:0 0 20px;display:grid;place-items:center}
  .nav-item .ic svg{width:18px;height:18px}
  .nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:rgba(109,76,187,.1);color:var(--lilac)}
  .nav-item.active .badge{background:rgba(255,255,255,.22);color:#fff}
  .sidebar-foot{margin-top:auto;padding:16px 12px 2px;font-size:11.5px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line)}
  .sidebar-foot strong{color:var(--lilac);font-weight:700}

  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .wrap{max-width:1200px;width:100%;margin:0 auto;padding:34px 42px 70px}
  .head{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .head .titlewrap{flex:1;min-width:220px}
  .crumb{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--lilac);margin-bottom:8px;flex-wrap:wrap}
  .crumb button{color:var(--lilac);font-weight:700;letter-spacing:1px}
  .crumb button:hover{text-decoration:underline}
  .crumb .sep{opacity:.55}
  .head h2{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:-.3px;color:var(--ink);display:flex;align-items:center;gap:14px;line-height:1.05}
  .head h2 .bemoji{font-size:32px}
  .backbtn{width:40px;height:40px;border-radius:12px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow);transition:.15s;flex:0 0 40px}
  .backbtn:hover{background:var(--lilac-soft);transform:translateX(-2px)}
  .backbtn svg{width:19px;height:19px}
  .counts{font-size:14.5px;color:var(--muted);padding-bottom:4px;white-space:nowrap;font-weight:500}

  /* Toolbar & Filters */
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
  .search{display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--line);padding:10px 15px;border-radius:12px;flex:1;min-width:240px;max-width:420px;box-shadow:var(--shadow);transition:.15s}
  .search:focus-within{border-color:var(--lilac);box-shadow:0 0 0 3px rgba(109,76,187,.12)}
  .search svg{width:17px;height:17px;color:var(--lilac);flex:0 0 17px}
  .search input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink)}
  .search .clear-btn{display:none;color:var(--subtle);font-size:16px;line-height:1;padding:2px 4px}
  .search .clear-btn.show{display:block}
  .chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .chip{padding:8px 13px;border-radius:99px;background:var(--white);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);transition:.14s}
  .chip:hover{background:var(--lilac-soft);color:var(--ink)}
  .chip.active{background:var(--lilac);color:#fff;border-color:var(--lilac)}

  /* Grids */
  .sec-sub{margin:26px 0 12px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--lilac)}
  .fgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
  @media(max-width:1180px){.fgrid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:960px){.fgrid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:680px){.fgrid{grid-template-columns:repeat(2,1fr)}}
  .folder{position:relative;background:var(--tint,#EDE6FA);border:1px solid rgba(109,76,187,.12);border-radius:18px;padding:18px 16px 15px;cursor:pointer;overflow:hidden;box-shadow:0 3px 12px rgba(72,48,125,.05);transition:.16s;min-height:168px;display:flex;flex-direction:column}
  .folder:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(72,48,125,.14);border-color:rgba(109,76,187,.32)}
  .folder .ficon{width:48px;height:48px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:23px;margin-bottom:14px;box-shadow:0 4px 10px rgba(72,48,125,.1)}
  .folder .fname{font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;margin-bottom:auto}
  .folder .fcount{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:10px}
  .folder .fcount svg{width:14px;height:14px;opacity:.75}

  .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  @media(max-width:1180px){.cgrid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:820px){.cgrid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.cgrid{grid-template-columns:1fr}}
  .card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:.16s;border:1px solid var(--line)}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--lilac-mid)}
  .card .preview{position:relative;height:178px;background:linear-gradient(150deg,var(--lilac-soft),var(--lilac-mid));display:grid;place-items:center;border-bottom:1px solid var(--line);cursor:pointer;overflow:hidden}
  .card .preview img.pdfthumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff;z-index:1;transition:transform .25s ease}
  .card .preview:hover img.pdfthumb{transform:scale(1.03)}
  .card .preview-overlay{position:absolute;inset:0;z-index:2;background:rgba(42,33,66,.35);display:grid;place-items:center;opacity:0;transition:.18s}
  .card .preview:hover .preview-overlay{opacity:1}
  .card .preview-pill{background:#fff;color:var(--ink);font-size:12px;font-weight:700;padding:7px 13px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.18);display:flex;align-items:center;gap:6px}
  .card .preview-pill svg{width:14px;height:14px;color:var(--lilac)}
  .card .filetype-badge{position:absolute;left:10px;bottom:10px;z-index:3;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.94);color:var(--lilac);padding:3px 8px;border-radius:6px;box-shadow:0 2px 6px rgba(42,33,66,.12)}
  .card .folder-tag{position:absolute;right:10px;bottom:10px;z-index:3;font-size:10.5px;font-weight:700;background:rgba(42,33,66,.78);color:#fff;padding:3px 8px;border-radius:6px;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .body{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1}
  .card .body h3{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.32;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .fsize{font-size:11.5px;color:var(--subtle);margin-bottom:12px}
  .card .actions{margin-top:auto;display:flex;gap:8px}
  .card .btn-prev{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--lilac-soft);color:var(--lilac);transition:.14s}
  .card .btn-prev:hover{background:var(--lilac-mid)}
  .card .btn-prev svg{width:16px;height:16px}
  .card .dl{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--lilac);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;border-radius:10px;transition:.14s}
  .card .dl:hover{background:var(--lilac-dark)}
  .card .dl svg{width:15px;height:15px}

  /* Empty */
  .empty{text-align:center;padding:64px 20px;color:var(--muted)}
  .empty .em-ic{width:74px;height:74px;border-radius:20px;background:var(--lilac-soft);display:grid;place-items:center;margin:0 auto 18px;color:var(--lilac)}
  .empty .em-ic svg{width:36px;height:36px}
  .empty h3{font-family:var(--serif);color:var(--ink);font-size:20px;margin-bottom:6px;font-weight:600}
  .empty p{font-size:14px;max-width:380px;margin:0 auto;line-height:1.5}

  /* Preview Modal */
  .modal{display:none;position:fixed;inset:0;z-index:120;background:rgba(32,24,52,.65);backdrop-filter:blur(4px);padding:24px;align-items:center;justify-content:center}
  .modal.open{display:flex}
  .modal-box{background:var(--white);border-radius:20px;max-width:920px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(24,16,44,.32);border:1px solid var(--line)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--paper)}
  .modal-head h3{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);line-height:1.2}
  .modal-head span{font-size:12px;color:var(--muted);display:block;margin-top:2px}
  .modal-close{width:36px;height:36px;border-radius:10px;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-size:18px;flex:0 0 36px}
  .modal-close:hover{background:var(--lilac-soft)}
  .modal-body{flex:1;overflow:auto;padding:20px;background:#F2EDF9;display:flex;align-items:center;justify-content:center;min-height:300px}
  .modal-body img{max-width:100%;max-height:66vh;border-radius:10px;box-shadow:0 10px 30px rgba(42,33,66,.16);background:#fff}
  .modal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-top:1px solid var(--line);background:var(--white);flex-wrap:wrap}
  .modal-foot .meta{font-size:12.5px;color:var(--muted)}
  .modal-foot .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn-sec{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;background:var(--lilac-soft);color:var(--lilac);font-weight:600;font-size:13.5px;transition:.14s}
  .btn-sec:hover{background:var(--lilac-mid)}
  .btn-pri{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;background:var(--lilac);color:#fff;font-weight:600;font-size:13.5px;transition:.14s}
  .btn-pri:hover{background:var(--lilac-dark)}

  /* Mobile */
  .menu-btn{display:none}
  @media(max-width:860px){
    body{flex-direction:column}
    .sidebar{position:fixed;left:0;top:0;z-index:80;transform:translateX(-100%);transition:.22s;width:262px;flex-basis:auto}
    .sidebar.open{transform:translateX(0)}
    .backdrop{display:none;position:fixed;inset:0;background:rgba(30,24,48,.45);z-index:75}
    .backdrop.show{display:block}
    .menu-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--white);box-shadow:var(--shadow);color:var(--ink);margin-bottom:14px;border:1px solid var(--line)}
    .menu-btn svg{width:20px;height:20px}
    .wrap{padding:20px 18px 60px}
    .head h2{font-size:30px}
  }
</style>
</head>

<script>
const COLORS={
  lavender:{tint:"#EDE6FA"},
  lilac:{tint:"#F3ECFC"},
  indigo:{tint:"#E8EAF8"},
  sky:{tint:"#E5EFF9"},
  mint:{tint:"#E4F3ED"},
  sage:{tint:"#EBF3E8"},
  peach:{tint:"#FCEEE6"},
  rose:{tint:"#FAE8EE"},
  butter:{tint:"#FBF4DE"}
};
const SECTIONS=[
  {id:"all",label:"Todas las categorías",title:"Repositorio de recursos",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'},
  {id:"tematica",label:"Biblioteca Psicológica",title:"Repositorio de recursos",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg>'},
  {id:"herramientas",label:"Herramientas de sesión",title:"Herramientas de sesión",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6a2 2 0 0 1 2-2h11l3 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M8 8h6M8 12h8M8 16h5"/></svg>'},
  {id:"kitinfantil",label:"Material infanto-juvenil",title:"Material infanto-juvenil",icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0"/><path d="M9 9h.01M15 9h.01"/></svg>'},
  {id:"cuadernillos",label:"👑 Cuadernillos",title:"👑 Cuadernillos",premium:true,icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>'}
];
const SEC_META={
  all:{label:"Biblioteca Psicológica",title:"Repositorio de recursos"},
  tematica:{label:"Biblioteca Psicológica",title:"Repositorio de recursos"},
  herramientas:{label:"Herramientas de sesión",title:"Herramientas de sesión"},
  kitinfantil:{label:"Material infanto-juvenil",title:"Material infanto-juvenil"},
  cuadernillos:{label:"👑 Cuadernillos",title:"👑 Cuadernillos"}
};
const TYPE_FILTERS=[
  {id:"all",label:"Todos"},
  {id:"psico",label:"Psicoeducación",match:t=>/psicoeduc|qué es|que es|ciclo|trampa|modelo|entendiendo|mitos/i.test(t)},
  {id:"reg",label:"Registros y Tareas",match:t=>/registro|autorregistro|diario|tarea|carta|plan|jerarqu|semaforo|semáforo|termómetro|termometro/i.test(t)},
  {id:"guia",label:"Guías y Protocolos",match:t=>/guía|guia|protocolo|manual|intervenci|técnica|tecnica|conceptualiz/i.test(t)},
  {id:"eval",label:"Evaluación",match:t=>/evalua|cuestionario|escala|entrevista|anamnesis|criterio|diagnóstic|diagnost|riesgo/i.test(t)}
];

const CAT=window.CATALOG||{folders:[],files:[]};
function col(k){return COLORS[k]||COLORS.lavender}
function esc(s){return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function norm(s){return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function extOf(n){return (String(n).split(".").pop()||"PDF").toUpperCase().slice(0,4)}
function fileSize(b){if(!b&&b!==0)return"";if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(0)+" KB";return (b/1048576).toFixed(1)+" MB"}
function childrenOf(id){return CAT.folders.filter(f=>f.parent===id).sort((a,b)=>(a.order||0)-(b.order||0))}
function topFolders(sec){return sec==="all"?CAT.folders.filter(f=>!f.parent).sort((a,b)=>(a.order||0)-(b.order||0)):CAT.folders.filter(f=>f.section===sec&&!f.parent).sort((a,b)=>(a.order||0)-(b.order||0))}
function getFolder(id){return CAT.folders.find(f=>f.id===id)}
function isLeaf(id){return childrenOf(id).length===0}
function filesOf(id){return CAT.files.filter(f=>f.folder===id)}
function countRec(id){const k=childrenOf(id);if(k.length)return k.reduce((a,c)=>a+countRec(c.id),0);return filesOf(id).length}
function sectionFileCount(sec){
  if(sec==="all")return CAT.files.length;
  const fids=new Set(CAT.folders.filter(f=>f.section===sec).map(f=>f.id));
  fids.add(sec);
  return CAT.files.filter(f=>fids.has(f.folder)).length;
}
function pathTo(id){const p=[];let f=getFolder(id);while(f){p.unshift(f);f=f.parent?getFolder(f.parent):null}return p}

let view="all", curFolder=null, searchTerm="", activeType="all";

function renderNav(){
  const nav=document.getElementById("nav");nav.innerHTML="";
  const l=document.createElement("div");l.className="nav-lbl";l.textContent="Categorías clínicas";nav.appendChild(l);
  SECTIONS.forEach(s=>{
    const b=document.createElement("button");
    const active=(view===s.id)||(view==="folder"&&folderSection()===s.id);
    b.className="nav-item"+(s.premium?" premium":"")+(active?" active":"");
    const cnt=sectionFileCount(s.id);
    b.innerHTML=`<span class="ic">${s.icon}</span><span>${s.label}</span><span class="badge">${cnt}</span>`;
    b.onclick=()=>{view=s.id;curFolder=null;activeType="all";setSearch("");closeSidebar();render()};
    nav.appendChild(b);
  });
  const total=CAT.files.length;
  document.getElementById("foot").innerHTML=`<strong>Vine a Terapia</strong><br>Biblioteca Psicológica · ${total} recursos disponibles.`;
}
function folderSection(){const f=getFolder(curFolder);return f?f.section:null}

function renderFilterChips(show){
  const wrap=document.getElementById("filterChips");
  wrap.innerHTML="";
  if(!show)return;
  TYPE_FILTERS.forEach(tf=>{
    const b=document.createElement("button");
    b.className="chip"+(activeType===tf.id?" active":"");
    b.textContent=tf.label;
    b.onclick=()=>{activeType=tf.id;render()};
    wrap.appendChild(b);
  });
}

function filterByType(files){
  if(activeType==="all")return files;
  const tf=TYPE_FILTERS.find(x=>x.id===activeType);
  return tf?files.filter(f=>tf.match((f.title||"")+" "+(f.name||""))):files;
}

function render(){
  renderNav();
  const stage=document.getElementById("stage");
  document.getElementById("backSlot").innerHTML="";
  document.getElementById("crumb").innerHTML="";
  document.getElementById("clearSearch").classList.toggle("show",searchTerm.length>0);

  if(view==="folder"){
    const folder=getFolder(curFolder);
    if(!folder){view="all";curFolder=null;return render()}
    const sec=SEC_META[folder.section]||{label:folder.section};
    const path=pathTo(folder.id);
    const parts=[`<button data-sec="${folder.section}">${esc(sec.label)}</button>`];
    path.slice(0,-1).forEach(p=>parts.push(`<span class="sep">›</span><button data-f="${p.id}">${esc(p.name)}</button>`));
    const cr=document.getElementById("crumb");cr.innerHTML=parts.join("");
    cr.querySelectorAll("button").forEach(bt=>bt.onclick=()=>{if(bt.dataset.sec){view=bt.dataset.sec;curFolder=null}else curFolder=bt.dataset.f;activeType="all";setSearch("");render()});
    document.getElementById("titleText").innerHTML=`<span class="bemoji">${folder.emoji||"📁"}</span> ${esc(folder.name)}`;
    const back=document.createElement("button");back.className="backbtn";
    back.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
    back.onclick=()=>{if(folder.parent){curFolder=folder.parent}else{view=folder.section;curFolder=null}activeType="all";setSearch("");render()};
    document.getElementById("backSlot").appendChild(back);

    if(!isLeaf(folder.id)){
      renderFilterChips(false);
      let kids=childrenOf(folder.id);
      const tf=kids.reduce((a,k)=>a+countRec(k.id),0);
      document.getElementById("counts").textContent=`${kids.length} secciones · ${tf} recursos`;
      document.getElementById("searchInput").placeholder="Buscar sección o recurso…";
      if(searchTerm){
        const t=norm(searchTerm);
        kids=kids.filter(k=>norm(k.name).includes(t));
      }
      stage.innerHTML="";
      if(kids.length){
        const g=document.createElement("div");g.className="fgrid";
        kids.forEach(k=>g.appendChild(folderCard(k)));stage.appendChild(g);
      }
      if(searchTerm){
        const childIds=new Set(childrenOf(folder.id).map(k=>k.id));
        const t=norm(searchTerm);
        const matched=CAT.files.filter(f=>childIds.has(f.folder)&&(norm(f.title).includes(t)||norm(f.name).includes(t)));
        if(matched.length){
          const lbl=document.createElement("div");lbl.className="sec-sub";lbl.textContent=`Recursos encontrados (${matched.length})`;stage.appendChild(lbl);
          const cg=document.createElement("div");cg.className="cgrid";matched.forEach(f=>cg.appendChild(fileCard(f,true)));stage.appendChild(cg);
        } else if(!kids.length){
          stage.appendChild(makeEmpty("Sin resultados","Prueba con otro término de búsqueda."));
        }
      }
      return;
    }

    renderFilterChips(true);
    let files=filesOf(folder.id).slice();
    files=filterByType(files);
    if(searchTerm){const t=norm(searchTerm);files=files.filter(f=>norm(f.title).includes(t)||norm(f.name).includes(t))}
    document.getElementById("counts").textContent=`${files.length} recurso${files.length===1?"":"s"}`;
    document.getElementById("searchInput").placeholder="Buscar en esta carpeta…";
    stage.innerHTML="";
    if(!files.length){stage.appendChild(makeEmpty("Sin resultados","No hay recursos que coincidan con este filtro."));return}
    const g=document.createElement("div");g.className="cgrid";
    files.forEach(f=>g.appendChild(fileCard(f,false)));stage.appendChild(g);
    return;
  }

  // Section view (all / tematica / herramientas / kitinfantil / cuadernillos)
  const meta=SEC_META[view]||{label:view,title:view};
  document.getElementById("crumb").textContent=meta.label;
  document.getElementById("titleText").textContent=meta.title;

  if(view==="cuadernillos"){
    renderFilterChips(true);
    let files=filesOf("cuadernillos").slice();
    files=filterByType(files);
    if(searchTerm){const t=norm(searchTerm);files=files.filter(f=>norm(f.title).includes(t)||norm(f.name).includes(t))}
    document.getElementById("counts").textContent=`${files.length} cuadernillo${files.length===1?"":"s"}`;
    document.getElementById("searchInput").placeholder="Buscar cuadernillo…";
    stage.innerHTML="";
    const notice=document.createElement("div");
    notice.className="notice-banner";
    notice.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg><div>Estos son cuadernillos que puedes entregar a tu paciente para que a libre demanda o con tus instrucciones, desarrolle como tarea. Los ejercicios desarrollados no siguen un plan de tratamiento, ni un orden jerárquico, por lo que se recomienda supervisión clínica.</div>';
    stage.appendChild(notice);
    if(!files.length){
      stage.appendChild(makeEmpty(searchTerm||activeType!=="all"?"Sin resultados":"Aún no hay cuadernillos publicados",searchTerm||activeType!=="all"?"No hay cuadernillos que coincidan con este filtro.":"Agrega los PDFs y miniaturas en la carpeta archivos/cuadernillos/ y ejecuta publicar.command."));
      return;
    }
    const g=document.createElement("div");g.className="cgrid";
    files.forEach(f=>g.appendChild(fileCard(f,false)));stage.appendChild(g);
    return;
  }

  const list=topFolders(view);
  const loose=view==="all"?[]:filesOf(view);
  const tf=sectionFileCount(view);
  document.getElementById("counts").textContent=`${list.length} carpeta${list.length===1?"":"s"} · ${tf} recursos`;
  document.getElementById("searchInput").placeholder="Buscar en toda la biblioteca…";

  const showGlobalResults = searchTerm.trim().length > 0 || activeType !== "all";
  renderFilterChips(true);

  let flist=list;
  if(searchTerm){const t=norm(searchTerm);flist=list.filter(f=>norm(f.name).includes(t))}
  stage.innerHTML="";

  if(flist.length && activeType==="all"){
    const g=document.createElement("div");g.className="fgrid";flist.forEach(f=>g.appendChild(folderCard(f)));stage.appendChild(g);
  }

  if(showGlobalResults){
    const allowedFolders=view==="all"?null:new Set([...CAT.folders.filter(f=>f.section===view).map(f=>f.id),view]);
    let pool=allowedFolders?CAT.files.filter(f=>allowedFolders.has(f.folder)):CAT.files;
    pool=filterByType(pool);
    if(searchTerm){const t=norm(searchTerm);pool=pool.filter(f=>norm(f.title).includes(t)||norm(f.name).includes(t)||norm((getFolder(f.folder)||{}).name||"").includes(t))}
    if(pool.length){
      const lbl=document.createElement("div");lbl.className="sec-sub";lbl.textContent=`Recursos encontrados (${pool.length})`;
      stage.appendChild(lbl);
      const cg=document.createElement("div");cg.className="cgrid";
      pool.slice(0,120).forEach(f=>cg.appendChild(fileCard(f,true)));
      stage.appendChild(cg);
    } else if(!flist.length || activeType!=="all"){
      stage.appendChild(makeEmpty("Sin resultados","No hay recursos que coincidan con tu búsqueda."));
    }
  } else if(!searchTerm && loose.length){
    const lbl=document.createElement("div");lbl.className="sec-sub";lbl.textContent="Compendio general";
    stage.appendChild(lbl);
    const cg=document.createElement("div");cg.className="cgrid";loose.forEach(f=>cg.appendChild(fileCard(f,false)));stage.appendChild(cg);
  }
}

function folderCard(f){
  const c=col(f.color);const container=!isLeaf(f.id);const count=countRec(f.id);
  const el=document.createElement("div");el.className="folder";el.style.setProperty("--tint",c.tint);
  el.innerHTML=`
    <div class="ficon">${f.emoji||"📁"}</div>
    <div class="fname">${esc(f.name)}</div>
    <div class="fcount"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M3 13l9 5 9-5"/></svg>${container?childrenOf(f.id).length+" secciones · "+count+" archivos":count+" recurso"+(count===1?"":"s")}</div>`;
  el.onclick=()=>{view="folder";curFolder=f.id;activeType="all";setSearch("");render()};
  return el;
}

function fileCard(f, showFolderTag){
  const ext=extOf(f.name||f.path);
  const hasThumb=typeof f.thumb==="string"&&f.thumb.length>0;
  const visual=hasThumb
    ?`<img class="pdfthumb" src="${esc(f.thumb)}" alt="${esc(f.title)}" loading="lazy">`
    :`<svg width="46" height="54" viewBox="0 0 48 56" fill="none"><path d="M6 2h26l10 10v40a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#fff" stroke="#C7B6E8" stroke-width="1.5"/><path d="M32 2v10h10" fill="#EDE6FA" stroke="#C7B6E8" stroke-width="1.5"/></svg>`;
  const folderObj=getFolder(f.folder);
  const tagHtml=(showFolderTag&&folderObj)?`<span class="folder-tag">${esc(folderObj.name)}</span>`:"";
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`
    <div class="preview">
      ${visual}
      <div class="preview-overlay"><span class="preview-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg> Vista previa</span></div>
      <span class="filetype-badge">${ext}</span>
      ${tagHtml}
    </div>
    <div class="body">
      <h3>${esc(f.title||f.name)}</h3>
      <div class="fsize">${fileSize(f.size)}</div>
      <div class="actions">
        <button class="btn-prev" title="Vista previa" aria-label="Vista previa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <a class="dl" href="${esc(f.path)}" download="${esc(f.name||'recurso.pdf')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Descargar</a>
      </div>
    </div>`;
  card.querySelector(".preview").onclick=()=>openModal(f);
  card.querySelector(".btn-prev").onclick=()=>openModal(f);
  return card;
}

function openModal(f){
  const folderObj=getFolder(f.folder);
  document.getElementById("modalTitle").textContent=f.title||f.name;
  document.getElementById("modalSubtitle").textContent=(folderObj?folderObj.name+" · ":"")+"vineaterapia.com";
  document.getElementById("modalMeta").textContent=`Formato PDF · ${fileSize(f.size)}`;
  const body=document.getElementById("modalBody");
  if(f.thumb){
    body.innerHTML=`<img src="${esc(f.thumb)}" alt="${esc(f.title)}" />`;
  } else {
    body.innerHTML=`<p style="color:var(--muted)">Vista previa no disponible. Puedes abrir el PDF completo.</p>`;
  }
  const openBtn=document.getElementById("modalOpen");
  openBtn.href=f.path;
  const dlBtn=document.getElementById("modalDl");
  dlBtn.href=f.path;
  dlBtn.setAttribute("download",f.name||"recurso.pdf");
  document.getElementById("previewModal").classList.add("open");
}

function closeModal(){document.getElementById("previewModal").classList.remove("open")}
document.getElementById("modalClose").onclick=closeModal;
document.getElementById("previewModal").onclick=e=>{if(e.target.id==="previewModal")closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function makeEmpty(t,h){const d=document.createElement("div");d.className="empty";d.innerHTML=`<div class="em-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5l2 3h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/></svg></div><h3>${t}</h3><p>${h}</p>`;return d}
function setSearch(v){searchTerm=v;document.getElementById("searchInput").value=v}
function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("backdrop").classList.remove("show")}
document.getElementById("searchInput").oninput=e=>{searchTerm=e.target.value;render()};
document.getElementById("clearSearch").onclick=()=>{setSearch("");render()};
document.getElementById("menuBtn").onclick=()=>{document.getElementById("sidebar").classList.add("open");document.getElementById("backdrop").classList.add("show")};
document.getElementById("backdrop").onclick=closeSidebar;
render();
</script>
</body>
</html>
